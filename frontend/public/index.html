<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5B8C5A">
  <title>家庭点菜 · 今天吃啥</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="greet" id="greet">傍晚好</div>
        <h1 class="app-title">家庭点菜</h1>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs">
      <button class="tab on" data-tab="today"><span class="ic">🍽️</span>今天吃啥</button>
      <button class="tab" data-tab="recipes"><span class="ic">📖</span>菜谱</button>
      <button class="tab" data-tab="inventory"><span class="ic">🥫</span>库存</button>
      <button class="tab" data-tab="log"><span class="ic">🗓️</span>日志</button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <div id="sheet-mask" class="sheet-mask" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
